services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: engo
      POSTGRES_PASSWORD: engo
      POSTGRES_DB: engo_advisor
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U engo"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file: .env
    depends_on:
      postgres: {condition: service_healthy}
    ports: ["8080:8080"]

volumes:
  pgdata:
